data:
  data_dir: ../bitfsd-generator/output/sidenet_data_ego
  coordinate_frame: ego
  side_semantics: track_global
  input_mode: xyz
  num_classes: 2
  include_dirs: null
  exclude_dirs: []
  allow_legacy_without_metadata: false
  normalize: null

split:
  strategy: track_holdout
  seed: 42
  val_ratio: 0.2
  val_groups: [FSCZ24, FSG24, FSS22]

model:
  architecture: transformer
  d_model: 64
  nhead: 4
  num_layers: 3
  dim_feedforward: 128
  dropout: 0.1

training:
  seed: 42
  epochs: 500
  batch_size: 16
  lr: 0.001
  weight_decay: 0.01
  device: auto
  deterministic: true
  selection_metric: macro_track_accuracy

augmentation:
  enabled: true
  transform_origin: ego
  rot_range: 0.05236
  scale_range: [0.97, 1.03]
  noise_std: 0.02
  flip_prob: 0.5

save:
  save_dir: runs/transformer
  checkpoint_name: transformer.pth
