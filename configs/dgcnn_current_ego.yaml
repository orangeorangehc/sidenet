# Split of the existing corpus, recorded in splits/current_ego.json.
# Train: remaining families; validation: FSCZ24/FSG21.
# Final test: FSG24/FSS22, excluded from this training configuration.
data:
  data_dir: ../bitfsd-generator/output/sidenet_data_ego
  coordinate_frame: ego
  side_semantics: track_global
  input_mode: xyz
  num_classes: 2
  include_dirs:
    - FSCZ24
    - FSE22
    - FSE22_test
    - FSE23
    - FSE24
    - FSG19
    - FSG21
    - FSG23
    - FSI24
    - FSO20
    - FSS19
  exclude_dirs: []
  allow_legacy_without_metadata: false
  normalize: null

split:
  strategy: track_holdout
  seed: 42
  val_ratio: 0.2
  val_groups: [FSCZ24, FSG21]  # Explicit groups determine the actual ratio.

model:
  architecture: dgcnn
  dropout: 0.1
  dgcnn_k: 16
  dgcnn_dims: [64, 64, 128]

training:
  seed: 42
  epochs: 300
  batch_size: 16
  lr: 0.001
  weight_decay: 0.01
  device: auto
  deterministic: true
  selection_metric: macro_track_accuracy

augmentation:
  enabled: true
  transform_origin: ego
  rot_range: 0.05236
  scale_range: [0.97, 1.03]
  noise_std: 0.02
  flip_prob: 0.5

save:
  save_dir: runs/dgcnn_current_ego
  checkpoint_name: dgcnn.pth
