data:
  data_dir: ../bitfsd-generator/output/sidenet_data_ego
  coordinate_frame: ego
  side_semantics: track_global
  input_mode: xy
  num_classes: 2
  include_dirs: null
  exclude_dirs: []
  allow_legacy_without_metadata: false
  normalize: null

split:
  strategy: track_holdout
  seed: 42
  val_ratio: 0.2
  val_groups: [FSCZ24, FSG24, FSS22]

model:
  architecture: lateral

training:
  seed: 42
  epochs: 1
  batch_size: 1
  lr: 0.0
  device: cpu
  deterministic: true
  selection_metric: macro_track_accuracy

augmentation:
  enabled: false

save:
  save_dir: runs/lateral
  checkpoint_name: lateral.pth
