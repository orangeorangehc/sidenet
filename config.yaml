# Recommended SideNet baseline. Paths are relative to the SideNet project root.

data:
  data_dir: ../bitfsd-generator/output/sidenet_data_ego
  coordinate_frame: ego
  side_semantics: track_global
  input_mode: xyz        # generator scores are synthetic constants; do not train on them
  num_classes: 2
  include_dirs: null       # null = trust dataset_manifest.yaml exactly
  exclude_dirs: []
  allow_legacy_without_metadata: false
  normalize: null          # ego-frame input is already translation-canonicalized

split:
  strategy: track_holdout  # track_holdout | random_frame (legacy smoke test only)
  seed: 42
  val_ratio: 0.2
  val_groups: [FSCZ24, FSG24, FSS22]

model:
  architecture: dgcnn
  dropout: 0.1
  dgcnn_k: 16
  dgcnn_dims: [64, 64, 128]

training:
  seed: 42
  epochs: 300
  batch_size: 16
  lr: 0.001
  weight_decay: 0.01
  device: auto
  deterministic: true
  selection_metric: macro_track_accuracy

augmentation:
  enabled: true
  transform_origin: ego
  rot_range: 0.05236       # ±3° heading/localization robustness
  scale_range: [0.97, 1.03]
  noise_std: 0.02
  flip_prob: 0.5           # ego-y reflection with Left/Right permutation

save:
  save_dir: runs/dgcnn
  checkpoint_name: dgcnn.pth
